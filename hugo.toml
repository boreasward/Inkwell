# 主题默认配置：Hugo 只合并主题配置里的 params，其余配置请写在站点配置中。

[params.home]
  listStyle = "compact"          # 或 "summary"
[params.article]
  showWordCount = true
  showReadingTime = true
  externalLinkNewTab = true
[params.search]
  enable = false
[params.math]
  enable = true
  css = "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
  cssIntegrity = "sha384-u1zONI5gPXUx0UKI62c75/zww972y0v2rSK5ZYlVdS6xEuWDeZWUI66v6t1gvlXJ"
[params.mermaid]
  url = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"
[params.header]
  navIcons = true                # 导航菜单项前的图标
[params.footer]
  text = ""
  links = []                     # [{ name, url, icon }]，与 RSS 同一行、带图标
[params.pet]
  enable = true                  # 页面底部随机蹦跳的小兔子
[params.comments.giscus]
  repo = ""                      # 非空即开启评论
  repoId = ""
  category = ""
  categoryId = ""
  mapping = "pathname"
