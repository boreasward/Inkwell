{{- /* 表格：外包一层 .table-wrap，超宽时在容器内横向滚动。 */ -}}
<div class="table-wrap">
<table>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
